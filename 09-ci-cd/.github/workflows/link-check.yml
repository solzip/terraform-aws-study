# ==========================================
# link-check.yml - 문서 링크 검사 워크플로우 (학습용)
# ==========================================
#
# 이 파일을 왜 학습 자료로 넣었는가:
#   같은 디렉토리의 terraform-*.yml 워크플로우들은 실행하려면
#   AWS 자격증명이 필요하고, 잘못 돌리면 실제 리소스가 생성되어 과금됩니다.
#   처음 GitHub Actions를 배울 때는 부담스럽습니다.
#
#   반면 링크 검사는:
#     - 자격증명이 필요 없습니다
#     - 실패해도 아무것도 망가지지 않습니다
#     - 20초 안에 끝나서 결과를 바로 확인할 수 있습니다
#
#   그래서 "워크플로우가 어떻게 도는가"를 익히기에 가장 좋은 예제입니다.
#
# 이 워크플로우가 하는 일:
#   저장소의 모든 .md 문서에서 링크를 뽑아 실제로 열리는지 확인하고,
#   하나라도 깨져 있으면 실패시킵니다.
#
# ⚠️ 이 파일은 지금 위치(09-ci-cd/.github/)에서는 실행되지 않습니다.
#    GitHub은 저장소 루트의 .github/workflows/만 읽기 때문입니다.
#    실제로 동작하는 같은 워크플로우는 main 브랜치 루트에 있습니다:
#    https://github.com/solzip/terraform-aws-study/blob/main/.github/workflows/link-check.yml
#
#    자세한 설명: docs/link-check-guide.md

# ==========================================
# name - Actions 탭에 표시되는 이름
# ==========================================
name: "Link Check (학습용)"

# ==========================================
# on - 언제 실행할 것인가 (트리거)
# ==========================================
#
# 워크플로우를 배울 때 가장 중요한 부분입니다.
# "무엇을 하는가"보다 "언제 도는가"를 잘못 잡으면
# 필요할 때 안 돌거나, 필요 없는데 계속 돌아 시간을 낭비합니다.
on:
  # ------------------------------------------
  # 1) push - 코드를 밀어 넣었을 때
  # ------------------------------------------
  # branches: 어느 브랜치에 Push될 때 반응할지
  # paths:    어떤 파일이 바뀌었을 때만 반응할지
  #
  # paths가 없으면 .tf 파일만 고쳐도 링크 검사가 돕니다.
  # 문서 검사이므로 문서가 바뀐 경우로 한정하는 것이 맞습니다.
  push:
    branches: [main]
    paths:
      - "**/*.md"
      - ".lycheeignore"

  # ------------------------------------------
  # 2) pull_request - PR이 올라왔을 때
  # ------------------------------------------
  # 머지되기 전에 검사하는 것이 핵심입니다.
  # main에 깨진 링크가 들어간 뒤에 고치는 것보다
  # PR 단계에서 막는 편이 훨씬 좋습니다.
  pull_request:
    branches: [main]
    paths:
      - "**/*.md"

  # ------------------------------------------
  # 3) schedule - 정해진 시각에 자동 실행
  # ------------------------------------------
  # cron 형식: 분 시 일 월 요일 (UTC 기준)
  #
  #   0 0 * * 1  →  매주 월요일 UTC 00:00 = KST 09:00
  #   0 * * * *  →  매시 정각
  #   30 15 * * * → 매일 UTC 15:30 = KST 다음날 00:30
  #
  # 왜 필요한가:
  #   내 저장소를 전혀 건드리지 않아도 링크가 죽을 수 있습니다.
  #   상대 사이트가 문서를 옮기면 그렇습니다.
  #   실제로 이 저장소에서도 www.terraform.io/docs가
  #   developer.hashicorp.com으로 이전되어 308 리다이렉트가 되었습니다.
  #
  # ⚠️ schedule은 저장소 기본 브랜치(main)에 있는 워크플로우만 실행됩니다.
  schedule:
    - cron: "0 0 * * 1"

  # ------------------------------------------
  # 4) workflow_dispatch - 수동 실행 버튼
  # ------------------------------------------
  # 이걸 넣어두면 Actions 탭에 "Run workflow" 버튼이 생깁니다.
  # 학습 중에는 이 트리거가 가장 유용합니다.
  # Push를 기다릴 필요 없이 원할 때 바로 돌려볼 수 있습니다.
  workflow_dispatch:

# ==========================================
# permissions - GITHUB_TOKEN에 줄 권한
# ==========================================
#
# GITHUB_TOKEN은 워크플로우 실행마다 자동 발급되는 임시 토큰입니다.
# 기본값이 넉넉한 편이라, 필요한 만큼만 남기는 것이 안전합니다.
# 링크 검사는 코드를 읽기만 하므로 contents: read면 충분합니다.
permissions:
  contents: read

# ==========================================
# jobs - 실제로 할 일
# ==========================================
#
# 용어 정리:
#   Workflow (워크플로우) : .yml 파일 하나 = 자동화 프로세스 전체
#   Job      (잡)         : 워크플로우 안의 작업 단위, 기본적으로 병렬 실행
#   Step     (스텝)       : Job 안의 개별 단계, 위에서 아래로 순차 실행
#   Action   (액션)       : 재사용 가능한 부품 (uses:로 가져다 씀)
#   Runner   (러너)       : 실제로 실행되는 가상 머신
jobs:
  link-check:
    name: "Check documentation links"

    # GitHub이 제공하는 Ubuntu 가상 머신에서 실행합니다.
    # 매번 깨끗한 상태로 새로 만들어지므로
    # 이전 실행에서 만든 파일은 남아 있지 않습니다.
    runs-on: ubuntu-latest

    steps:
      # ==========================================
      # Step 1: 코드 내려받기
      # ==========================================
      #
      # Runner는 빈 상태로 시작합니다. 내 저장소 파일이 없습니다.
      # actions/checkout이 저장소를 Runner로 복제해 옵니다.
      #
      # 거의 모든 워크플로우의 첫 Step이 이것입니다.
      # 빠뜨리면 "파일을 찾을 수 없다"는 에러가 납니다.
      - name: Checkout
        uses: actions/checkout@v4

      # ==========================================
      # Step 2: 링크 검사 실행
      # ==========================================
      #
      # lychee는 Rust로 만든 링크 체커입니다.
      # lycheeverse/lychee-action이 설치와 실행을 대신 해줍니다.
      #
      # lychee가 검사하는 두 가지:
      #   1. 외부 URL  → 실제로 HTTP 요청을 보내 응답 코드 확인
      #   2. 상대 경로 → 그 파일이 실제로 있는지 확인
      #
      # 이 저장소에서 실제로 잡아냈던 문제들:
      #   - ../../tree/08-monitoring   상대 경로라 GitHub에서 404
      #   - CONTRIBUTORS.md            존재하지 않는 파일
      #   - docs/03-cleanup.md         실제 파일명은 03-.cleanup.md 였음
      - name: Run lychee
        uses: lycheeverse/lychee-action@v2
        with:
          # args: lychee에 그대로 전달되는 명령행 인자
          #
          #   --no-progress   진행률 애니메이션 끄기 (CI 로그가 지저분해짐)
          #   --max-retries   일시적 네트워크 오류 대비 재시도 횟수
          #   --timeout       응답 없는 사이트를 기다릴 최대 초
          #   --exclude-path  검사에서 뺄 파일
          #   './**/*.md'     검사 대상 (하위 디렉토리 포함 모든 마크다운)
          #
          # >- 는 YAML에서 여러 줄을 한 줄 문자열로 합치는 문법입니다.
          # 긴 인자 목록을 읽기 좋게 나눠 쓸 때 사용합니다.
          args: >-
            --no-progress
            --max-retries 3
            --timeout 20
            --exclude-path BRANCH_README_TEMPLATE.md
            './**/*.md'

          # fail: 깨진 링크가 있을 때 Job을 실패시킬지
          #   true  → 빨간 X, PR에 경고 표시 (권장)
          #   false → 결과만 보여주고 통과
          fail: true

          # jobSummary: Actions 실행 요약 화면에 결과 표를 출력
          jobSummary: true

        # env: 이 Step에만 적용되는 환경 변수
        #
        # github.com 링크를 검사할 때 토큰 없이 요청하면
        # API 호출 제한(rate limit)에 걸려 실패할 수 있습니다.
        # secrets.GITHUB_TOKEN은 별도 등록 없이 자동으로 쓸 수 있습니다.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
